name: Página pública de status

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar página
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Coletar incidentes e comentários
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const records = [];
            for (const issue of issues.filter((item) => !item.pull_request)) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              records.push({
                number: issue.number,
                title: issue.title,
                body: issue.body,
                state: issue.state,
                html_url: issue.html_url,
                created_at: issue.created_at,
                updated_at: issue.updated_at,
                closed_at: issue.closed_at,
                labels: issue.labels,
                comments_data: comments.map((comment) => ({
                  body: comment.body,
                  created_at: comment.created_at,
                  updated_at: comment.updated_at,
                })),
              });
            }
            fs.mkdirSync("site/.generated", { recursive: true });
            fs.writeFileSync("site/.generated/issues.json", JSON.stringify(records));

      - name: Instalar dependências
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Executar testes
        working-directory: site
        run: npm test

      - name: Compilar página
        working-directory: site
        run: npm run build

      - name: Verificar limite do JavaScript
        working-directory: site
        run: npm run check:bundle

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Publicar página
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
